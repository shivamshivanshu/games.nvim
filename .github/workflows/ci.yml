name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.11.0, stable]
    env:
      LUALS_VERSION: 3.15.0
      STYLUA_VERSION: 2.5.2
      FZF_VERSION: 0.74.0
      FZF_SHA256: cf919f05b7581b4c744d764eaa704665d61dd6d3ca785f0df2351281dff60cda
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install Neovim
        run: |
          dir="$RUNNER_TEMP/nvim"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${{ matrix.neovim }}/nvim-linux-x86_64.tar.gz" | tar -xz -C "$dir" --strip-components=1
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/nvim" --version | head -1
      - name: Install stylua
        if: matrix.neovim == 'stable'
        run: |
          dir="$RUNNER_TEMP/stylua"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip" -o "$dir/stylua.zip"
          unzip -q "$dir/stylua.zip" -d "$dir"
          chmod +x "$dir/stylua"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Install lua-language-server
        if: matrix.neovim == 'stable'
        run: |
          dir="$RUNNER_TEMP/luals"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" | tar -xz -C "$dir"
          echo "LUALS=$dir/bin/lua-language-server" >> "$GITHUB_ENV"
      - name: Lint and all tests
        if: matrix.neovim == 'stable'
        run: make check
      - name: Install fzf
        if: matrix.neovim == 'stable'
        run: |
          dir="$RUNNER_TEMP/fzf"
          mkdir -p "$dir"
          tarball="$dir/fzf.tar.gz"
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz" -o "$tarball"
          echo "${FZF_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Finder smoke tests against the real pickers
        if: matrix.neovim == 'stable'
        run: make smoke-finders PICKERS_PACK="$RUNNER_TEMP/pickers"
      - name: Lua tests on the oldest supported Neovim
        if: matrix.neovim != 'stable'
        run: make test-lua
